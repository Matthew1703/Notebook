name: Pipeline 
on: [push]

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort mypy pylint

      - name: Check formatting with Black
        run: black --check src tests
        
      - name: Sort imports with isort
        run: isort --check-only --diff src tests
        
      - name: Type check with mypy
        run: mypy src tests
        
      - name: Lint with pylint
        run: pylint src tests --fail-under=8
  
  tests:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Run tests
        run: pytest --cov=src --cov-fail-under=50

  deploy:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Add GitLab to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts

      - name: Install roles ansible
        run: |
          cd ansible
          ansible-galaxy install -r requirements.yml -p roles/

      - name: Deploy
        run: |
          cd ansible
          ansible-playbook -i inventory/ playbook.yml -k -e 'github_token=$CUSTOM_GITHUB_TOKEN'
